name: Compilar instalador de Windows

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Preparar .env con la API key (secreto de GitHub, nunca en el código)
        shell: bash
        run: echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > .env

      # --onedir (no --onefile): el modo onefile descomprime todo el programa a una
      # carpeta temporal en CADA arranque, lo que hacía la app lentísima al abrir.
      # Con onedir el instalador copia la carpeta ya lista y arranca al instante.
      - name: Compilar Formato606 (carpeta del programa)
        run: |
          pyinstaller --onedir --windowed --name Formato606 --icon icon.ico app.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar el instalador (Formato606-Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Subir el instalador amigable
        uses: actions/upload-artifact@v4
        with:
          name: Formato606-Instalador
          path: dist_installer\Formato606-Setup.exe

      - name: Subir la carpeta portátil (por si prefieres no usar el instalador)
        uses: actions/upload-artifact@v4
        with:
          name: Formato606-portable
          path: dist\Formato606
